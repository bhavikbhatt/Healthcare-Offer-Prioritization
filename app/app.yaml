# Offer Management Console - Lakebase Version
#
# Reads recommendations from the Lakebase Postgres table
# offer_prioritization.lakebase_offers (database databricks_postgres) and writes
# feedback to the Delta table bhavik_demos.offer_prioritization.offer_feedback via
# the SQL Statement Execution API.
#
# A `postgres` app resource (Lakebase project offer-prioritization) provisions the
# app service principal's Postgres role so it can connect. The app mints its own
# OAuth token (DATABRICKS_CLIENT_ID/SECRET) for both Lakebase and the SQL API.

command: ["python", "app.py"]

env:
  - name: FLASK_RUN_HOST
    value: "0.0.0.0"
  - name: FLASK_RUN_PORT
    value: "8000"
  # Lakebase primary endpoint host for the offer-prioritization project
  - name: LAKEBASE_HOST
    value: "ep-sweet-shadow-d2du2zdd.database.us-east-1.cloud.databricks.com"
  - name: PGDATABASE
    value: "databricks_postgres"
  # SQL Warehouse used to write feedback to the Delta table
  - name: DATABRICKS_WAREHOUSE_ID
    value: "c5373a0bb5c8d31b"
  # Unity Catalog that holds the Delta feedback table
  - name: DELTA_CATALOG
    value: "bhavik_demos"
